    class SoundEngine {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playCorrect() {
        this.init();
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50];

        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.05);

          gain.gain.setValueAtTime(0, now + idx * 0.05);
          gain.gain.linearRampToValueAtTime(0.2, now + idx * 0.05 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.2);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now + idx * 0.05);
          osc.stop(now + idx * 0.05 + 0.2);
        });
      }

      playIncorrect() {
        this.init();
        const now = this.ctx.currentTime;

        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc1.type = 'sawtooth';
        osc2.type = 'sawtooth';

        osc1.frequency.setValueAtTime(140, now);
        osc1.frequency.linearRampToValueAtTime(100, now + 0.3);

        osc2.frequency.setValueAtTime(147, now);
        osc2.frequency.linearRampToValueAtTime(105, now + 0.3);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(this.ctx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.3);
        osc2.stop(now + 0.3);
      }

      playApplause() {
        this.init();
        const now = this.ctx.currentTime;
        const duration = 2.5;

        const chords = [
          { time: 0.0, freqs: [523.25, 659.25, 783.99] },
          { time: 0.25, freqs: [659.25, 783.99, 1046.50] },
          { time: 0.5, freqs: [523.25, 659.25, 783.99, 1046.50, 1318.51] }
        ];

        chords.forEach(chord => {
          chord.freqs.forEach(freq => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + chord.time);

            const chordDur = chord.time === 0.5 ? 1.0 : 0.2;
            gain.gain.setValueAtTime(0.12, now + chord.time);
            gain.gain.exponentialRampToValueAtTime(0.001, now + chord.time + chordDur);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now + chord.time);
            osc.stop(now + chord.time + chordDur);
          });
        });

        const bufferSize = this.ctx.sampleRate * duration;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1000, now);
        filter.Q.setValueAtTime(1.0, now);

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.01, now);
        noiseGain.gain.linearRampToValueAtTime(0.18, now + 0.4);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(this.ctx.destination);

        noise.start(now);
        noise.stop(now + duration);
      }
    }

          "Levothyroxine 50 mcg/kg/day PO",
          "Liothyronine (T3) 5 mcg/kg/day IV",
          "Methimazole 1 mg/kg/day PO"
        ],
        answer: 0
      },
      {
        question: "A patient at 41 weeks gestation has an unfavorable cervix (Bishop score <6). What intravaginal prostaglandin is used for cervical ripening?",
        options: [
          "Dinoprostone 10mg vaginal insert (Cervidil) slow release over 12 hours",
          "Oxytocin 20 Units IM",
          "Misoprostol 400mcg IV push",
          "Mifepristone 200mg vaginally"
        ],
        answer: 0
      },
      {
        question: "An infant born at 26 weeks gestation exhibits persistent hypotension refractory to volume resuscitation. Hydrocortisone therapy dose:",
        options: [
          "Hydrocortisone 1 mg/kg IV every 8-12 hours",
          "Dexamethasone 5 mg/kg IV",
          "Prednisolone 2 mg/kg PO",
          "Epinephrine infusion 1 mcg/kg/min"
        ],
        answer: 0
      },
      {
        question: "A pregnant female at 32 weeks presents with active Herpes Simplex Virus (HSV) genital lesions. To suppress viral shedding for vaginal delivery option, administer:",
        options: [
          "Acyclovir 400mg PO TID from 36 weeks until delivery",
          "Valacyclovir 2000mg PO single dose",
          "Ganciclovir 5mg/kg IV BID",
          "Famciclovir 125mg PO once"
        ],
        answer: 0
      },
      {
        question: "A neonate born with Meconium Aspiration Syndrome (MAS) develops Persistent Pulmonary Hypertension of the Newborn (PPHN). Selective pulmonary vasodilator therapy:",
        options: [
          "Inhaled Nitric Oxide (iNO) at 20 ppm",
          "IV Sildenafil 5 mg/kg/hr",
          "Milrinone 1 mg/kg bolus",
          "Prostaglandin E1 infusion"
        ],
        answer: 0
      },
      {
        question: "A patient at 36 weeks experiencing severe preeclampsia is given IV Magnesium Sulfate. The target therapeutic serum magnesium level is:",
        options: [
          "4.0 to 7.0 mEq/L (4.8 to 8.4 mg/dL)",
          "1.0 to 2.0 mEq/L",
          "10.0 to 12.0 mEq/L",
          "15.0 to 20.0 mEq/L"
        ],
        answer: 0
      }
    ];

    let currentIdx = 0;
    let score = 0;
    let answered = false;

    // Helper: Shuffle choices dynamically while preserving correct answer tracking
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function loadQuestion() {
      answered = false;
      const q = questions[currentIdx];

      document.getElementById("question-number").innerText = `Case ${currentIdx + 1} of ${questions.length}`;
      document.getElementById("question-text").innerText = q.question;

      // Prepare options with tracking
      let formattedOptions = q.options.map((opt, i) => ({
        text: opt,
        isCorrect: i === q.answer
      }));

      // Shuffle choices so correct answer isn't always option A
      formattedOptions = shuffleArray(formattedOptions);

      const optsContainer = document.getElementById("options-container");
      optsContainer.innerHTML = "";

      formattedOptions.forEach((optObj) => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left p-3.5 rounded-xl bg-slate-700/60 hover:bg-slate-700 text-slate-200 border border-slate-600/50 hover:border-slate-500 transition duration-150 text-sm leading-snug";
        btn.onclick = () => handleAnswer(optObj.isCorrect, btn, optsContainer);
        btn.innerHTML = `<span>${optObj.text}</span>`;
        btn.dataset.correct = optObj.isCorrect;
        optsContainer.appendChild(btn);
      });
    }

    function handleAnswer(isCorrect, btnElement, container) {
      if (answered) return;
      answered = true;

      const allButtons = container.children;

      if (isCorrect) {
        score++;
        soundEngine.playCorrect();
        btnElement.classList.remove("bg-slate-700/60", "border-slate-600/50");
        btnElement.classList.add("bg-emerald-600/30", "border-emerald-500", "text-emerald-200", "font-medium");
      } else {
        soundEngine.playIncorrect();
        btnElement.classList.remove("bg-slate-700/60", "border-slate-600/50");
        btnElement.classList.add("bg-rose-600/30", "border-rose-500", "text-rose-200");

        // Highlight correct choice
        Array.from(allButtons).forEach(btn => {
          if (btn.dataset.correct === "true") {
            btn.classList.remove("bg-slate-700/60", "border-slate-600/50");
            btn.classList.add("bg-emerald-600/20", "border-emerald-500/50", "text-emerald-300");
          }
        });
      }

      document.getElementById("score-display").innerText = `Score: ${score} / ${questions.length}`;

      setTimeout(() => {
        currentIdx++;
        if (currentIdx < questions.length) {
          loadQuestion();
        } else {
          showResults();
        }
      }, 1400);
    }

    function showResults() {
      document.getElementById("quiz-container").classList.add("hidden");
      document.getElementById("quiz-header").classList.add("hidden");

      const resultContainer = document.getElementById("result-container");
      resultContainer.classList.remove("hidden");

      document.getElementById("final-score").innerText = `Nilai Akhir Anda: ${score} dari ${questions.length} Soal (${Math.round((score/questions.length)*100)}%)`;

      soundEngine.playApplause();
    }

    function restartQuiz() {
      currentIdx = 0;
      score = 0;
      document.getElementById("score-display").innerText = `Score: 0 / ${questions.length}`;
      document.getElementById("result-container").classList.add("hidden");
      document.getElementById("quiz-container").classList.remove("hidden");
      document.getElementById("quiz-header").classList.remove("hidden");
      loadQuestion();
    }

    // Launch application
    loadQuestion();
  </script>
</body>
</html>
